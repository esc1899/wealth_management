[server]
# Fixer App-Port. Bewusst NICHT 6655, da dieser Port in einer der
# Installationen mit dem lokalen LLM-Proxy kollidiert.
port = 8655
address = "localhost"
# Unterdrückt den interaktiven Streamlit-Erststart-Dialog (E-Mail-Abfrage),
# der sonst beim ersten "streamlit run" auf einem frischen Rechner den
# Start blockiert. Browser muss dann von Hand geöffnet werden.
headless = true
# Seit 21.09.2026 läuft die App unter /wealth/ — auch direkt am Port:
# http://localhost:8655/wealth/. So kann Caddy auf dem Mac mini sie unter
# http://localhost/wealth/ durchreichen (heimnetzwerk-Repo, Registry
# deploy/dienste/dienste.toml, zugang = "lokal": nur vom Rechner selbst).
baseUrlPath = "wealth"

# Die Lotsee-Optik (seit 12.10.2026, Fassung C2 "Richtfeuer"): Nacht in der Seitenleiste,
# ein kuehles Grau als Grund, Blau als Leitfarbe von Wealth. Die Werte stammen aus
# assets/lotsee/tokens.json (Kopie aus dem Repo lotsee); tests/test_optik.py haelt sie gleich.
# Cursor im Menue, Zeichen und Lichtschein: core/ui/optik.py.
[theme]
base = "light"
primaryColor = "#1F4FD1"
backgroundColor = "#F3F6F8"
secondaryBackgroundColor = "#E9EFF3"
textColor = "#0B1E2D"
linkColor = "#1F4FD1"
borderColor = "#DCE6EC"
baseRadius = "0.5rem"
font = "sans-serif"
headingFont = "sans-serif"

[theme.sidebar]
backgroundColor = "#0B1E2D"
secondaryBackgroundColor = "#13293A"
textColor = "#D3E0EA"
primaryColor = "#5B8CFF"
borderColor = "#1E3546"
