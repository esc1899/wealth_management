# Asset class configuration
# Each class defines: investment type, default unit, visible fields, price source.
# Add new classes here — no code change required.
#
# Flags:
#   auto_fetch: true  — price is fetched automatically via yfinance (requires ticker)
#   auto_fetch: false — price must be entered manually (estimated_value in extra_data)
#   watchlist_eligible: true  — position can appear on the watchlist
#   watchlist_eligible: false — portfolio-only (Festgeld, Immobilien, etc.)
#   manual_valuation: true — "Schätzwert aktualisieren" button shown in detail view
#   extra_fields — type-specific fields stored in extra_data (JSON, encrypted)
#   block — aktien, geldwerte or sachwerte (see bloecke below): where the class stands on the tiles
#           and in the charts
#   farbe — the class colour, the same everywhere in the app (tiles; monogram instead of a logo),
#           a shade of its block's colour family
#   pruefbar: false — the checks (story, fundamentals, consensus, capital allocation, devil's
#                     advocate) do not run for this class and its tiles show no verdicts: they
#                     judge companies and funds, a commodity has none of that (default: true)

# The blocks, in the order the tiles and charts show them. Each has a colour family: the block's
# own colour (heading, overview, charts) and a shade of it for each of its classes.
bloecke:
  aktien:
    farbe: "#1A5BA0"
  geldwerte:
    farbe: "#13734F"
  sachwerte:
    farbe: "#A6402A"

asset_classes:

  Aktie:
    investment_type: Wertpapiere
    block: aktien
    farbe: "#1A5BA0"
    default_unit: Stück
    auto_fetch: true
    watchlist_eligible: true
    anlagearten:
      - Einzelaktie
      - ADR / GDR
    visible_fields:
      - isin
      - wkn
      - ticker
      - quantity
      - purchase_price
      - purchase_date
      - recommendation_source
      - strategy
      - notes
    price_source: yfinance
    requires_ticker: true

